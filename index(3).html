<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cagando</title>
<meta name="description" content="Todos os meus xogos e aplicacións nun só sitio.">
<meta name="theme-color" content="#F5D23A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='6' y='6' width='88' height='88' rx='22' fill='%23F5D23A' stroke='%23000' stroke-width='8'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900'>c</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F5D23A;
  --tinta:#000;
  --papel:#FFFDF6;
  --suave:rgba(0,0,0,.62);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%;
  background:var(--fondo); color:var(--tinta);
  font-family:"Bricolage Grotesque","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.marco{max-width:1080px; margin:0 auto; padding:clamp(20px,5vw,56px) clamp(14px,4vw,40px) 56px}

/* ---------- Cabeceira ---------- */
header{margin-bottom:clamp(26px,5vw,52px)}
.marca{
  font-weight:800; font-size:clamp(64px,16vw,168px); line-height:.82; letter-spacing:-.055em; margin:0;
  color:var(--papel); -webkit-text-stroke:3px var(--tinta); paint-order:stroke fill;
  text-shadow:6px 6px 0 #000;
}
.lema{margin:14px 0 0; font-size:clamp(16px,2.2vw,21px); font-weight:600; color:var(--suave); max-width:34ch}

/* ---------- Grella: 4 por fila no móbil ---------- */
.grella{
  list-style:none; margin:0; padding:0;
  display:grid; gap:16px 10px;
  grid-template-columns:repeat(4,minmax(0,1fr));
}
@media (min-width:600px){
  .grella{grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:30px 22px}
}
.grella li{display:flex; justify-content:center}

.app{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
  width:100%; text-decoration:none; color:inherit; outline:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- O post-it ---------- */
.icona{
  width:100%; max-width:132px; aspect-ratio:1;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.07) 0, rgba(0,0,0,0) 16%),
    linear-gradient(to top right, rgba(0,0,0,.08) 0, rgba(0,0,0,0) 22%),
    var(--cor,#fff);
  border-radius:1px 1px 3px 22px / 1px 1px 3px 8px;
  box-shadow:0 1px 1px rgba(0,0,0,.18), 2px 12px 14px -9px rgba(0,0,0,.55);
  transform:rotate(var(--giro,0deg));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:8px 4px;
  transition:transform .2s cubic-bezier(.3,1.5,.5,1), box-shadow .2s;
}
.icona svg{width:48%; height:48%; overflow:visible; flex:none}
.nome{font-weight:800; font-size:11px; line-height:1.05; color:#000; max-width:100%; overflow-wrap:anywhere}
.desc{display:none; font-size:13px; line-height:1.3; color:var(--suave); max-width:18ch}
.selo{font-size:10px; font-weight:800; color:#000; border:1.5px dashed rgba(0,0,0,.55); border-radius:999px; padding:0 6px; white-space:nowrap}

@media (min-width:600px){
  .icona{gap:8px; padding:12px 8px 10px}
  .icona svg{width:50%; height:50%}
  .nome{font-size:15px; line-height:1.1}
  .desc{display:block}
  .selo{font-size:12px; border-width:2px; padding:1px 8px}
}

@media (hover:hover){
  a.app:hover .icona{transform:rotate(0deg) translateY(-6px) scale(1.04);
    box-shadow:0 1px 1px rgba(0,0,0,.18), 4px 22px 20px -12px rgba(0,0,0,.55)}
}
a.app:active .icona{transform:rotate(0deg) translateY(1px) scale(.97)}
a.app:focus-visible .icona{outline:3px solid #000; outline-offset:5px}

.app.pronto{cursor:default}
.app.pronto .icona{filter:grayscale(1); opacity:.5}

/* ---------- Recolocar ---------- */
.app.agarrando .icona{transform:rotate(0deg) scale(1.08); transition-duration:.45s}
li.oco .app{opacity:.2}
.fantasma{
  position:fixed; left:0; top:0; z-index:10; pointer-events:none; margin:0;
  transform-origin:center;
}
.fantasma .icona{transform:rotate(-4deg) scale(1.12); box-shadow:0 1px 1px rgba(0,0,0,.2), 6px 26px 24px -12px rgba(0,0,0,.6); transition:none}
body.recolocando{cursor:grabbing}

footer{margin-top:56px; font-size:14px; color:var(--suave); display:flex; gap:14px; flex-wrap:wrap; align-items:center}
.restaurar{font:inherit; font-size:14px; color:inherit; background:none; border:none; padding:0; text-decoration:underline; cursor:pointer}
.restaurar[hidden]{display:none}

@media (prefers-reduced-motion:reduce){ .icona{transition:none} }
</style>
</head>
<body>
<div class="marco">
  <header>
    <h1 class="marca">cagando</h1>
    <p class="lema">Os meus xogos e ferramentas, todos nun sitio.</p>
  </header>

  <main>
    <ul class="grella" id="grella"></ul>
  </main>

  <footer>
    <span>Mantén premido un post-it para cambialo de sitio.</span>
    <button class="restaurar" id="restaurar" type="button" hidden>Volver á orde inicial</button>
  </footer>
</div>

<script>
/* =========================================================
   EDITA AQUÍ OS TEUS PROXECTOS
   ---------------------------------------------------------
   - url: o enderezo. Se o deixas baleiro (""), o post-it sae
     en gris co selo "En camiño" e non se pode entrar.
   - cor: a cor do post-it.
   - icona: o nome dun debuxo da lista ICONAS (máis abaixo).
   - Para engadir un proxecto, copia unha liña { ... } e cambia os datos.
   - A orde desta lista é a orde inicial. Se alguén recoloca os
     post-its, a súa orde gárdase só no seu navegador.
   ========================================================= */
const APPS = [
  { nome:"Imperdible",        desc:"O reto diario do mapa",      url:"https://perdible.vercel.app",         cor:"#C3A6FF", icona:"imperdible" },
  { nome:"Concellos",         desc:"Atopa os 313 no mapa",       url:"https://concellosgz.vercel.app",      cor:"#7CCBF5", icona:"concellos" },
  { nome:"Xadrez",            desc:"As coalicións de Schönberg", url:"https://xadrezcoalicions.vercel.app", cor:"#FF7A6B", icona:"xadrez" },
  { nome:"Ese bicho son eu",  desc:"Que bicho es ti?",           url:"https://esebichosoneu.vercel.app",    cor:"#A8EB7E", icona:"bicho" },
  { nome:"Cadáver exquisito", desc:"Debuxo colectivo a cegas",   url:"https://exquisitocadaver.vercel.app", cor:"#FFFFFF", icona:"cadaver" },
  { nome:"Libro de heroes",   desc:"Follas de personaxe D&D",    url:"https://folladnd.vercel.app",         cor:"#F2C79A", icona:"libro" },
  { nome:"Caderno de canto",  desc:"Estudo do repertorio",       url:"https://luisafernanda.vercel.app",    cor:"#FF9EC4", icona:"canto" },
  { nome:"Matamiolos",        desc:"Quen foi? Lóxica pura",      url:"",                                    cor:"#FFB45E", icona:"lupa" },
  { nome:"Baralla",           desc:"Mus, tute, brisca e máis",   url:"",                                    cor:"#6FE0C8", icona:"cartas" },
  { nome:"Forxa",             desc:"Deseña xogos de mesa",       url:"",                                    cor:"#CFD8E3", icona:"forxa" },
  { nome:"Particol",          desc:"Partituras compartidas",     url:"",                                    cor:"#F7F2E4", icona:"nota" },
];

/* =========================================================
   DEBUXOS DOS POST-ITS (SVG, caixa de 48×48)
   ========================================================= */
const T = 'stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
const ICONAS = {
  imperdible:`<svg viewBox="0 0 48 48"><path d="M10 38 L34 10" ${T} fill="none"/><path d="M34 10 a5 5 0 1 1 5 6 L16 41 a3 3 0 0 1-4-4" ${T} fill="none"/><path d="M16 41 L10 38" ${T}/><circle cx="37.5" cy="11" r="2" fill="#000"/><path d="M6 43 h6" ${T}/></svg>`,
  concellos:`<svg viewBox="0 0 48 48"><path d="M6 14 L18 8 L30 13 L42 8 L42 34 L30 40 L18 35 L6 40 Z" ${T} fill="#fff"/><path d="M18 8 V35 M30 13 V40" ${T}/><path d="M18 20 L30 24 L30 30 L18 26 Z" fill="#000"/></svg>`,
  xadrez:`<svg viewBox="0 0 48 48"><path d="M24 5 v8 M20 9 h8" ${T}/><path d="M16 22 c0-7 16-7 16 0 c0 4-3 6-3 10 h-10 c0-4-3-6-3-10z" ${T} fill="#F7D046"/><path d="M13 36 h22 l2 6 H11z" ${T} fill="#fff"/></svg>`,
  bicho:`<svg viewBox="0 0 48 48"><ellipse cx="24" cy="28" rx="11" ry="13" ${T} fill="#fff"/><circle cx="24" cy="13" r="6" ${T} fill="#fff"/><path d="M24 17 V41" ${T}/><path d="M13 24 L5 20 M13 31 L5 33 M35 24 L43 20 M35 31 L43 33 M21 8 L17 3 M27 8 L31 3" ${T}/><circle cx="19" cy="25" r="2.2" fill="#000"/><circle cx="29" cy="33" r="2.2" fill="#000"/></svg>`,
  lupa:`<svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12" ${T} fill="#fff"/><path d="M29 29 L42 42" stroke="#000" stroke-width="6" stroke-linecap="round"/><path d="M15 18 a6 6 0 0 1 6-5" ${T} fill="none"/><text x="20" y="26" text-anchor="middle" font-size="15" font-weight="900" font-family="Arial Black,Arial">?</text></svg>`,
  cadaver:`<svg viewBox="0 0 48 48"><g ${T}><rect x="6" y="6" width="12" height="12" fill="#F04A3E"/><rect x="18" y="6" width="12" height="12" fill="#F7D046"/><rect x="30" y="6" width="12" height="12" fill="#4FA3F7"/><rect x="6" y="18" width="12" height="12" fill="#7BD389"/><rect x="18" y="18" width="12" height="12" fill="#A77BF3"/><rect x="30" y="18" width="12" height="12" fill="#FF9F40"/><rect x="6" y="30" width="12" height="12" fill="#F48FB1"/><rect x="18" y="30" width="12" height="12" fill="#2FB6A3"/><rect x="30" y="30" width="12" height="12" fill="#fff"/></g></svg>`,
  cartas:`<svg viewBox="0 0 48 48"><rect x="8" y="10" width="20" height="30" rx="3" transform="rotate(-12 18 25)" ${T} fill="#fff"/><rect x="20" y="8" width="20" height="30" rx="3" transform="rotate(10 30 23)" ${T} fill="#fff"/><circle cx="30" cy="23" r="5" ${T} fill="#F7D046"/><circle cx="30" cy="23" r="1.6" fill="#000"/></svg>`,
  libro:`<svg viewBox="0 0 48 48"><path d="M24 12 C18 8 11 8 5 10 V39 C11 37 18 37 24 41 C30 37 37 37 43 39 V10 C37 8 30 8 24 12 Z" ${T} fill="#FFF3D6"/><path d="M24 12 V41" ${T}/><path d="M33 17 L39 21 L37 29 L29 29 L27 21 Z" ${T} fill="#F04A3E"/></svg>`,
  forxa:`<svg viewBox="0 0 48 48"><path d="M8 26 h30 c0 5-4 7-9 7 v5 h5 v4 H15 v-4 h5 v-5 c-7 0-12-3-12-7z" ${T} fill="#fff"/><path d="M26 6 L40 20" stroke="#000" stroke-width="5" stroke-linecap="round"/><rect x="18" y="4" width="12" height="8" rx="2" transform="rotate(45 24 8)" ${T} fill="#F7D046"/></svg>`,
  nota:`<svg viewBox="0 0 48 48"><path d="M4 12 H44 M4 19 H44 M4 26 H44 M4 33 H44 M4 40 H44" stroke="#000" stroke-width="1.6" opacity=".4"/><ellipse cx="17" cy="36" rx="6" ry="4.4" transform="rotate(-20 17 36)" fill="#000"/><ellipse cx="33" cy="29" rx="6" ry="4.4" transform="rotate(-20 33 29)" fill="#000"/><path d="M22.5 34 V10 L38.5 5 V27" ${T} fill="none"/><path d="M22.5 13 L38.5 8" stroke="#000" stroke-width="5"/></svg>`,
  canto:`<svg viewBox="0 0 48 48"><rect x="16" y="4" width="16" height="24" rx="8" ${T} fill="#fff"/><path d="M10 22 a14 14 0 0 0 28 0 M24 36 V44 M16 44 H32" ${T} fill="none"/><path d="M20 12 H28 M20 18 H28" ${T}/></svg>`,
  caderno:`<svg viewBox="0 0 48 48"><rect x="10" y="5" width="30" height="38" rx="3" ${T} fill="#fff"/><path d="M6 12 h8 M6 20 h8 M6 28 h8 M6 36 h8" ${T}/><path d="M19 15 h15 M19 22 h15 M19 29 h9" ${T}/><path d="M28 34 l3 3 l6-7" ${T} fill="none"/></svg>`,
};

/* =========================================================
   DE AQUÍ PARA ABAIXO NON FAI FALLA TOCAR NADA
   ========================================================= */
const CLAVE = 'cagando-orde';
const XIROS = [-3, 2, -1.5, 3, -2.5, 1.5, -1, 2.5, -2, 1];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grella = document.getElementById('grella');
const botonRestaurar = document.getElementById('restaurar');

function lerOrde(){ try { return JSON.parse(localStorage.getItem(CLAVE)) || null; } catch(e){ return null; } }
function gardarOrde(){
  const orde = [...grella.children].map(li => li.dataset.nome);
  try { localStorage.setItem(CLAVE, JSON.stringify(orde)); } catch(e){}
  botonRestaurar.hidden = false;
}

/* Ordena segundo o gardado; os proxectos novos van ao final */
function appsOrdenadas(){
  const orde = lerOrde();
  if (!orde) return APPS;
  const pos = n => { const i = orde.indexOf(n); return i < 0 ? Infinity : i; };
  return APPS.map((a, i) => ({a, i})).sort((x, y) => (pos(x.a.nome) - pos(y.a.nome)) || (x.i - y.i)).map(o => o.a);
}

function pintar(){
  grella.innerHTML = appsOrdenadas().map(a => {
    const giro = XIROS[APPS.indexOf(a) % XIROS.length];
    const dentro = `
      <span class="icona" style="--cor:${esc(a.cor)};--giro:${giro}deg">
        ${ICONAS[a.icona] || ''}
        <span class="nome">${esc(a.nome)}</span>
      </span>
      ${a.url ? `<span class="desc">${esc(a.desc)}</span>` : `<span class="selo">En camiño</span>`}`;
    return a.url
      ? `<li data-nome="${esc(a.nome)}"><a class="app" href="${esc(a.url)}" draggable="false">${dentro}</a></li>`
      : `<li data-nome="${esc(a.nome)}"><div class="app pronto" aria-disabled="true" title="${esc(a.desc)}">${dentro}</div></li>`;
  }).join('');
  botonRestaurar.hidden = !lerOrde();
}
pintar();

botonRestaurar.addEventListener('click', () => {
  try { localStorage.removeItem(CLAVE); } catch(e){}
  pintar();
});

/* ---------- Manter premido para recolocar ---------- */
const ESPERA = 450;      // ms que hai que manter premido
const TOLERANCIA = 10;   // px que se pode mover o dedo antes de que conte como scroll
const movementoReducido = matchMedia('(prefers-reduced-motion: reduce)').matches;

let temporizador = null, inicio = null, liActivo = null, arrastrando = false;
let fantasma = null, desfase = {x:0, y:0}, evitarClic = false;

grella.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const li = e.target.closest('li');
  if (!li) return;
  liActivo = li;
  inicio = {x:e.clientX, y:e.clientY};
  li.querySelector('.app').classList.add('agarrando');
  temporizador = setTimeout(() => comezarArrastre(e), ESPERA);
});

function cancelarEspera(){
  clearTimeout(temporizador); temporizador = null;
  if (liActivo && !arrastrando) liActivo.querySelector('.app').classList.remove('agarrando');
}

function comezarArrastre(e){
  arrastrando = true;
  if (navigator.vibrate) navigator.vibrate(15);
  const app = liActivo.querySelector('.app');
  app.classList.remove('agarrando');
  const r = app.getBoundingClientRect();
  desfase = {x: inicio.x - r.left, y: inicio.y - r.top};
  fantasma = app.cloneNode(true);
  fantasma.classList.add('fantasma');
  fantasma.style.width = r.width + 'px';
  document.body.appendChild(fantasma);
  moverFantasma(inicio.x, inicio.y);
  liActivo.classList.add('oco');
  document.body.classList.add('recolocando');
}

function moverFantasma(x, y){
  fantasma.style.transform = `translate(${x - desfase.x}px, ${y - desfase.y}px)`;
}

/* Animación suave cando os post-its cambian de sitio */
function conAnimacion(cambio){
  const items = [...grella.children];
  const antes = new Map(items.map(li => [li, li.getBoundingClientRect()]));
  cambio();
  if (movementoReducido) return;
  items.forEach(li => {
    const a = antes.get(li), d = li.getBoundingClientRect();
    const dx = a.left - d.left, dy = a.top - d.top;
    if (!dx && !dy) return;
    li.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'none'}], {duration:180, easing:'ease-out'});
  });
}

window.addEventListener('pointermove', e => {
  if (!liActivo) return;
  if (!arrastrando){
    if (Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > TOLERANCIA) { cancelarEspera(); liActivo = null; }
    return;
  }
  moverFantasma(e.clientX, e.clientY);
  const debaixo = document.elementFromPoint(e.clientX, e.clientY)?.closest('#grella > li');
  if (!debaixo || debaixo === liActivo) return;
  const lista = [...grella.children];
  const despois = lista.indexOf(debaixo) > lista.indexOf(liActivo);
  conAnimacion(() => grella.insertBefore(liActivo, despois ? debaixo.nextSibling : debaixo));
});

function rematar(){
  cancelarEspera();
  if (arrastrando){
    arrastrando = false;
    fantasma?.remove(); fantasma = null;
    liActivo.classList.remove('oco');
    document.body.classList.remove('recolocando');
    gardarOrde();
    evitarClic = true;
    setTimeout(() => evitarClic = false, 400);
  }
  liActivo = null;
}
window.addEventListener('pointerup', rematar);
window.addEventListener('pointercancel', rematar);

/* Mentres se arrastra, que a páxina non faga scroll (iPhone/iPad) */
document.addEventListener('touchmove', e => { if (arrastrando) e.preventDefault(); }, {passive:false});
/* Sen menú de "abrir ligazón" ao manter premido */
grella.addEventListener('contextmenu', e => e.preventDefault());
/* Despois de recolocar, non entrar no proxecto */
grella.addEventListener('click', e => { if (evitarClic) { e.preventDefault(); e.stopPropagation(); } }, true);
</script>
</body>
</html>
