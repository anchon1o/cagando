<style>
:root{
  --fondo:#F5D23A;
  --tinta:#000;
  --papel:#FFFDF6;
  --suave:rgba(0,0,0,.62);
  --vermello:#E8322B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%;
  background:var(--fondo); color:var(--tinta);
  font-family:"Bricolage Grotesque","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.marco{max-width:1080px; margin:0 auto; padding:clamp(20px,5vw,56px) clamp(14px,4vw,40px) 56px}

/* ---------- Cabeceira ---------- */
header{position:relative; padding-right:104px; margin-bottom:clamp(26px,5vw,52px)}
.marca{
  font-weight:800; font-size:clamp(64px,16vw,168px); line-height:.82; letter-spacing:-.055em; margin:0;
  color:var(--papel); -webkit-text-stroke:3px var(--tinta); paint-order:stroke fill;
  text-shadow:6px 6px 0 #000;
}
.lema{margin:14px 0 0; font-size:clamp(16px,2.2vw,21px); font-weight:600; color:var(--suave); max-width:34ch}

/* ---------- Grella: 4 por fila no móbil ---------- */
.grella{
  list-style:none; margin:0; padding:0;
  display:grid; gap:16px 10px;
  grid-template-columns:repeat(4,minmax(0,1fr));
}
@media (min-width:600px){
  .grella{grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:30px 22px}
}
.grella li{display:flex; justify-content:center}

.app{
  position:relative;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
  width:100%; text-decoration:none; color:inherit; outline:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; /* sen zoom ao tocar dúas veces */
}

/* ---------- O post-it ---------- */
.icona{
  position:relative;
  width:100%; max-width:132px; aspect-ratio:1;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.07) 0, rgba(0,0,0,0) 16%),
    linear-gradient(to top right, rgba(0,0,0,.08) 0, rgba(0,0,0,0) 22%),
    var(--cor,#fff);
  border-radius:1px 1px 3px 22px / 1px 1px 3px 8px;
  box-shadow:0 1px 1px rgba(0,0,0,.18), 2px 12px 14px -9px rgba(0,0,0,.55);
  transform:rotate(var(--giro,0deg));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:8px 4px;
  transition:transform .2s cubic-bezier(.3,1.5,.5,1), box-shadow .2s;
}
.icona svg, .icona img{width:58%; height:58%; overflow:visible; flex:none; object-fit:contain}
/* Cando hai logo, o logo É o post-it */
.icona.con-logo{padding:0}
.icona.con-logo img{position:absolute; inset:0; margin:auto; width:calc(100% * var(--escala,1)); height:calc(100% * var(--escala,1)); object-fit:cover; border-radius:inherit}
.icona.con-logo img[style]{object-fit:contain; border-radius:0}
.icona.con-logo::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.10) 0, rgba(0,0,0,0) 14%),
    linear-gradient(to top right, rgba(0,0,0,.12) 0, rgba(0,0,0,0) 22%);
}
.icona .punto, .icona .feito{z-index:2}
.nome{font-weight:800; font-size:11px; line-height:1.1; color:#000; max-width:100%; overflow-wrap:anywhere; margin-top:2px}
.desc{display:none; font-size:10.5px; line-height:1.25; color:var(--suave); max-width:18ch; margin-top:-3px}
body.con-descricions .desc{display:block}
@media (hover:hover){
  body:not(.con-descricions) .app .desc{
    display:block; position:absolute; left:50%; bottom:calc(100% - 6px); z-index:5;
    width:max-content; max-width:180px; margin:0;
    background:#111; color:#fff; font-size:13px; font-weight:600; line-height:1.3;
    padding:6px 10px; border-radius:8px;
    opacity:0; transform:translate(-50%, 4px); pointer-events:none;
    transition:opacity .15s, transform .15s;
  }
  body:not(.con-descricions) .app .desc::after{content:""; position:absolute; left:50%; top:100%; margin-left:-6px; border:6px solid transparent; border-top-color:#111}
  body:not(.con-descricions) a.app:hover .desc, body:not(.con-descricions) .app.pronto:hover .desc{opacity:1; transform:translate(-50%, 0)}
  body.recolocando .app .desc{display:none !important}
}
.selo{font-size:10px; font-weight:800; color:#000; border:1.5px dashed rgba(0,0,0,.55); border-radius:999px; padding:0 6px; white-space:nowrap}

/* Feito hoxe (retos diarios) */
.feito{
  position:absolute; right:-4px; bottom:-4px;
  width:30%; aspect-ratio:1; border-radius:50%;
  background:#fff; border:2.5px solid #000;
  display:grid; place-items:center;
  transform:rotate(-12deg);
  box-shadow:1px 2px 0 rgba(0,0,0,.35);
}
.feito svg{width:62%; height:62%}
/* Punto de novidade */
.punto{
  position:absolute; top:-5px; right:-5px;
  width:16px; height:16px; border-radius:50%;
  background:var(--vermello); border:2.5px solid #000;
}

@media (min-width:600px){
  .icona{gap:8px; padding:12px 8px 10px}
  .icona svg, .icona img{width:60%; height:60%}
  .nome{font-size:15px; line-height:1.1}
  body.con-descricions .desc{font-size:13px}
  .selo{font-size:12px; border-width:2px; padding:1px 8px}
  .punto{width:20px; height:20px; top:-6px; right:-6px}
}

@media (hover:hover){
  a.app:hover .icona{transform:rotate(0deg) translateY(-6px) scale(1.04);
    box-shadow:0 1px 1px rgba(0,0,0,.18), 4px 22px 20px -12px rgba(0,0,0,.55)}
}
a.app:active .icona{transform:rotate(0deg) translateY(1px) scale(.97)}
a.app:focus-visible .icona{outline:3px solid #000; outline-offset:5px}

.app.pronto{cursor:pointer}
.app.pronto .icona{filter:grayscale(1); opacity:.5}
.app.pronto .nome{opacity:.6}
.app.pronto .icona.toque{animation:toque .25s ease}
@keyframes toque{40%{transform:rotate(calc(var(--giro) * -2)) scale(.94)}}

/* ---------- Recolocar e agochar ---------- */
.app.agarrando .icona{transform:rotate(0deg) scale(1.08); transition-duration:.45s}
li.oco .app{opacity:.2}
.fantasma{position:fixed; left:0; top:0; z-index:20; pointer-events:none; margin:0}
.fantasma .icona{transform:rotate(-4deg) scale(1.12); box-shadow:0 1px 1px rgba(0,0,0,.2), 6px 26px 24px -12px rgba(0,0,0,.6); transition:none}
.fantasma.vaise .icona{transform:rotate(8deg) scale(.8); opacity:.6}
body.recolocando{cursor:grabbing}

.zona-agochar{
  position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:15;
  transform:translate(-50%, 140%);
  display:flex; align-items:center; gap:10px;
  background:var(--papel); border:3px solid #000; border-radius:999px;
  padding:12px 22px; font-weight:800; font-size:16px; white-space:nowrap;
  box-shadow:4px 4px 0 #000;
  transition:transform .25s cubic-bezier(.3,1.4,.5,1), background .15s, opacity .2s, visibility .2s;
  pointer-events:none;
  opacity:0; visibility:hidden;
}
.zona-agochar svg{width:24px; height:24px}
body.recolocando .zona-agochar{transform:translate(-50%, 0); opacity:1; visibility:visible}
.zona-agochar.enriba{background:#000; color:var(--papel)}
.zona-agochar.enriba svg *{stroke:var(--papel)}

/* ---------- Caquiña con cronómetro ---------- */
.caca-caixa{position:absolute; top:0; right:0; display:flex; flex-direction:column; align-items:center; gap:4px}
.caca{background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
.caca img{display:block; width:clamp(70px,11vw,104px); height:auto; transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.caca:active img{transform:scale(.9)}
.caca.correndo img{animation:abanear 1.2s ease-in-out infinite; transform-origin:50% 100%}
.caca[data-cara="1"].correndo img{animation-duration:.7s}
.caca[data-cara="2"].correndo img{animation:tremer .18s linear infinite}
@keyframes abanear{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes tremer{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
.cara{display:none}
.caca[data-cara="0"] .cara0, .caca[data-cara="1"] .cara1, .caca[data-cara="2"] .cara2{display:inline}
.caca:focus-visible, .reloxo:focus-visible{outline:3px solid #000; outline-offset:4px; border-radius:12px}

.reloxo{
  font:inherit; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; color:#000; cursor:pointer;
  background:var(--papel); border:2px solid #000; border-radius:999px; padding:1px 9px; min-width:58px; text-align:center;
  touch-action:manipulation;
}
.reloxo[hidden]{display:none}

/* Panel de estatísticas */
dialog.panel{
  width:min(92vw, 380px); max-height:86vh; overflow:auto;
  border:3px solid #000; border-radius:4px 4px 6px 28px / 4px 4px 6px 12px;
  background:#FFE58A; color:#000; padding:22px 20px 18px;
  box-shadow:6px 8px 0 #000; font:inherit;
}
dialog.panel::backdrop{background:rgba(0,0,0,.35)}
.panel h2{margin:0 0 14px; font-size:26px; font-weight:800; letter-spacing:-.02em}
.cifras{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px}
.cifra{background:var(--papel); border:2px solid #000; border-radius:10px; padding:8px 10px}
.cifra b{display:block; font-size:22px; font-variant-numeric:tabular-nums; line-height:1.1}
.cifra span{font-size:13px; color:var(--suave)}
.panel h3{margin:0 0 6px; font-size:16px}
.ultimas{list-style:none; margin:0 0 16px; padding:0; font-variant-numeric:tabular-nums}
.ultimas li{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1.5px dashed rgba(0,0,0,.3); font-size:15px}
.baleiro{color:var(--suave); margin:0 0 16px}
.opcion{display:flex; align-items:center; gap:10px; font-weight:600; margin-bottom:16px; cursor:pointer}
.opcion input{width:20px; height:20px; accent-color:#000}
.botons{display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap}
.boton{font:inherit; font-weight:800; font-size:15px; color:#000; background:var(--papel); border:2px solid #000; border-radius:999px; padding:8px 16px; cursor:pointer; box-shadow:2px 2px 0 #000}
.boton:active{transform:translate(2px,2px); box-shadow:none}
.boton.discreto{background:none; box-shadow:none; border:none; text-decoration:underline; padding:8px 4px}

footer{margin-top:56px; font-size:14px; color:var(--suave); display:flex; gap:8px 16px; flex-wrap:wrap; align-items:center}
.restaurar{font:inherit; font-size:14px; color:inherit; background:none; border:none; padding:0; text-decoration:underline; cursor:pointer}
.restaurar[hidden]{display:none}
.axuda{flex-basis:100%}

@media (prefers-reduced-motion:reduce){
  .icona, .zona-agochar{transition:none}
  .caca.correndo img{animation:none !important}
}
</style>
</head>

/* =========================================================
   DE AQUÍ PARA ABAIXO NON FAI FALLA TOCAR NADA
   ========================================================= */
const ler = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch(e){ return def; } };
const gardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const borrar = k => { try { localStorage.removeItem(k); } catch(e){} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dd = n => String(n).padStart(2, '0');
const hoxe = () => { const d = new Date(); return `${d.getFullYear()}-${dd(d.getMonth()+1)}-${dd(d.getDate())}`; };

const K_ORDE = 'cagando-orde-2', K_VISITAS = 'cagando-visitas', K_AGOCHADOS = 'cagando-agochados';
const XIROS = [-3, 2, -1.5, 3, -2.5, 1.5, -1, 2.5, -2, 1];
const VISTO = `<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;

const grella = document.getElementById('grella');
const botonRestaurar = document.getElementById('restaurar');
const botonAmosar = document.getElementById('amosar');
const zona = document.getElementById('zona');

/* ---------- Visitas: "feito hoxe" e novidades ---------- */
function marcarVisita(nome){
  const v = ler(K_VISITAS, {}); v[nome] = hoxe(); gardar(K_VISITAS, v);
}

/* ---------- Orde ---------- */
function gardarOrde(){
  gardar(K_ORDE, [...grella.children].map(li => li.dataset.nome));
  botonRestaurar.hidden = false;
}
function appsOrdenadas(){
  const orde = ler(K_ORDE, null);
  if (!orde) return APPS.slice();
  const pos = n => { const i = orde.indexOf(n); return i < 0 ? Infinity : i; };
  return APPS.map((a, i) => ({a, i})).sort((x, y) => (pos(x.a.nome) - pos(y.a.nome)) || (x.i - y.i)).map(o => o.a);
}

/* ---------- Pintar ---------- */
function pintar(){
  const agochados = ler(K_AGOCHADOS, []);
  const visitas = ler(K_VISITAS, {});
  const lista = appsOrdenadas().filter(a => !agochados.includes(a.nome));
  /* As feitas sempre diante das que están en camiño */
  const ordenada = [...lista.filter(a => !a.encamino), ...lista.filter(a => a.encamino)];

  grella.innerHTML = ordenada.map(a => {
    const giro = XIROS[APPS.indexOf(a) % XIROS.length];
    const logo = a.logo || LOGOS[a.nome];
    const debuxo = logo ? `<img src="${esc(logo)}" alt="" draggable="false"${a.escala ? ` style="--escala:${a.escala}"` : ''}>` : (ICONAS[a.icona] || '');
    const feitoHoxe = a.diario && visitas[a.nome] === hoxe();
    const novidade = a.novo && !(visitas[a.nome] >= a.novo);
    const dentro = `
      <span class="icona${logo ? ' con-logo' : ''}" style="--cor:${esc(a.cor)};--giro:${giro}deg">
        ${debuxo}
        ${novidade ? `<span class="punto" title="Hai algo novo"></span>` : ''}
        ${feitoHoxe ? `<span class="feito" title="Xa o xogaches hoxe">${VISTO}</span>` : ''}
      </span>
      <span class="nome">${esc(a.nome)}</span>
      ${a.encamino ? `<span class="selo">En camiño</span>` : ''}
      ${a.desc ? `<span class="desc">${esc(a.desc)}</span>` : ''}`;
    const etiqueta = esc(a.nome + (feitoHoxe ? ', xa feito hoxe' : '') + (novidade ? ', con novidades' : ''));
    return a.encamino
      ? `<li data-nome="${esc(a.nome)}" data-grupo="encamino"><div class="app pronto" data-url="${esc(a.url)}" role="link" aria-label="${etiqueta}, en camiño: tres toques para entrar">${dentro}</div></li>`
      : `<li data-nome="${esc(a.nome)}" data-grupo="feita"><a class="app" href="${esc(a.url)}" draggable="false" aria-label="${etiqueta}">${dentro}</a></li>`;
  }).join('');

  botonRestaurar.hidden = !ler(K_ORDE, null);
  botonAmosar.hidden = !agochados.length;
  botonAmosar.textContent = `Amosar agochados (${agochados.length})`;
}
pintar();

/* Ao volver dunha app co botón "atrás", actualizar os ✓ */
window.addEventListener('pageshow', e => { if (e.persisted) pintar(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !arrastrando) pintar(); });

botonRestaurar.addEventListener('click', () => { borrar(K_ORDE); pintar(); });

/* Descricións: agochadas por defecto; o botón amósaas debaixo de cada nome */
const botonDesc = document.getElementById('descricions');
function aplicarDescricions(){
  const on = ler('cagando-descricions', false);
  document.body.classList.toggle('con-descricions', on);
  botonDesc.textContent = on ? 'Agochar descricións' : 'Amosar descricións';
}
botonDesc.addEventListener('click', () => { gardar('cagando-descricions', !ler('cagando-descricions', false)); aplicarDescricions(); });
aplicarDescricions();
botonAmosar.addEventListener('click', () => { borrar(K_AGOCHADOS); pintar(); });

/* ---------- Manter premido para recolocar ou agochar ---------- */
const ESPERA = 450;      // ms que hai que manter premido
const TOLERANCIA = 10;   // px que se pode mover o dedo antes de que conte como scroll
const movementoReducido = matchMedia('(prefers-reduced-motion: reduce)').matches;

let temporizador = null, inicio = null, liActivo = null, arrastrando = false;
let fantasma = null, desfase = {x:0, y:0}, evitarClic = false, sobreZona = false;

grella.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const li = e.target.closest('li');
  if (!li) return;
  liActivo = li;
  inicio = {x:e.clientX, y:e.clientY};
  li.querySelector('.app').classList.add('agarrando');
  temporizador = setTimeout(comezarArrastre, ESPERA);
});

function cancelarEspera(){
  clearTimeout(temporizador); temporizador = null;
  if (liActivo && !arrastrando) liActivo.querySelector('.app').classList.remove('agarrando');
}

function comezarArrastre(){
  arrastrando = true;
  if (navigator.vibrate) navigator.vibrate(15);
  const app = liActivo.querySelector('.app');
  app.classList.remove('agarrando');
  const r = app.getBoundingClientRect();
  desfase = {x: inicio.x - r.left, y: inicio.y - r.top};
  fantasma = app.cloneNode(true);
  fantasma.classList.add('fantasma');
  fantasma.style.width = r.width + 'px';
  document.body.appendChild(fantasma);
  moverFantasma(inicio.x, inicio.y);
  liActivo.classList.add('oco');
  document.body.classList.add('recolocando');
}

function moverFantasma(x, y){
  fantasma.style.transform = `translate(${x - desfase.x}px, ${y - desfase.y}px)`;
}

/* Animación suave cando os post-its cambian de sitio */
function conAnimacion(cambio){
  const items = [...grella.children];
  const antes = new Map(items.map(li => [li, li.getBoundingClientRect()]));
  cambio();
  if (movementoReducido) return;
  items.forEach(li => {
    const a = antes.get(li), d = li.getBoundingClientRect();
    const dx = a.left - d.left, dy = a.top - d.top;
    if (!dx && !dy) return;
    li.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'none'}], {duration:180, easing:'ease-out'});
  });
}

window.addEventListener('pointermove', e => {
  if (!liActivo) return;
  if (!arrastrando){
    if (Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > TOLERANCIA) { cancelarEspera(); liActivo = null; }
    return;
  }
  moverFantasma(e.clientX, e.clientY);

  /* Enriba da zona de agochar? */
  const z = zona.getBoundingClientRect();
  sobreZona = e.clientX >= z.left - 20 && e.clientX <= z.right + 20 && e.clientY >= z.top - 30 && e.clientY <= z.bottom + 20;
  zona.classList.toggle('enriba', sobreZona);
  fantasma.classList.toggle('vaise', sobreZona);
  if (sobreZona) return;

  const debaixo = document.elementFromPoint(e.clientX, e.clientY)?.closest('#grella > li');
  if (!debaixo || debaixo === liActivo) return;
  if (debaixo.dataset.grupo !== liActivo.dataset.grupo) return;   // non mesturar feitas e en camiño
  const lista = [...grella.children];
  const despois = lista.indexOf(debaixo) > lista.indexOf(liActivo);
  conAnimacion(() => grella.insertBefore(liActivo, despois ? debaixo.nextSibling : debaixo));
});

function rematar(){
  cancelarEspera();
  if (arrastrando){
    arrastrando = false;
    fantasma?.remove(); fantasma = null;
    liActivo.classList.remove('oco');
    document.body.classList.remove('recolocando');
    zona.classList.remove('enriba');
    if (sobreZona){
      const ag = ler(K_AGOCHADOS, []);
      if (!ag.includes(liActivo.dataset.nome)) ag.push(liActivo.dataset.nome);
      gardar(K_AGOCHADOS, ag);
      pintar();
    } else {
      gardarOrde();
    }
    sobreZona = false;
    evitarClic = true;
    setTimeout(() => evitarClic = false, 400);
  }
  liActivo = null;
}
window.addEventListener('pointerup', () => {
  /* Toque curto (sen arrastrar nin moverse) nun post-it en camiño */
  if (liActivo && !arrastrando){
    const app = liActivo.querySelector('.app.pronto');
    if (app) contarToque(app);
  }
  rematar();
});
window.addEventListener('pointercancel', rematar);

/* Mentres se arrastra, que a páxina non faga scroll (iPhone/iPad) */
document.addEventListener('touchmove', e => { if (arrastrando) e.preventDefault(); }, {passive:false});
/* Sen menú de "abrir ligazón" ao manter premido */
grella.addEventListener('contextmenu', e => e.preventDefault());
/* Clic nun post-it: apuntar a visita (ou nada, se se acaba de recolocar) */
grella.addEventListener('click', e => {
  if (evitarClic) { e.preventDefault(); e.stopPropagation(); return; }
  const a = e.target.closest('a.app');
  if (a) marcarVisita(a.closest('li').dataset.nome);
}, true);

/* En camiño: tres toques seguidos entran na web a medias */
let toques = 0, ultimoPronto = null, reloxToques = null;
function contarToque(app){
  if (app !== ultimoPronto) toques = 0;
  ultimoPronto = app; toques++;
  clearTimeout(reloxToques);
  reloxToques = setTimeout(() => toques = 0, 700);
  const ic = app.querySelector('.icona');
  ic.classList.remove('toque'); void ic.offsetWidth; ic.classList.add('toque');
  if (toques >= 3){
    toques = 0;
    marcarVisita(app.closest('li').dataset.nome);
    location.href = app.dataset.url;
  }
}

/* =========================================================
   CRONÓMETRO DA CAQUIÑA
   Un toque: comeza. Outro: para e garda o tempo.
   Tocando o tempo ábrense as estatísticas.
   ========================================================= */
const K_CRONO = 'cagando-crono', K_HISTORIAL = 'cagando-historial', K_SON = 'cagando-son';
const MINIMO = 3000;              // tempos de menos de 3 s non contan (toques sen querer)
const CARAS = [0, 3, 8];          // minutos a partir dos que cambia a cara
const botonCaca = document.getElementById('caca');
const reloxo = document.getElementById('reloxo');
const panel = document.getElementById('panel');
let crono = ler(K_CRONO, {});
let tic = null;

const formato = ms => {
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return h ? `${h}:${dd(m)}:${dd(s)}` : `${m}:${dd(s)}`;
};

function amosar(){
  const correndo = !!crono.inicio;
  const ms = correndo ? Date.now() - crono.inicio : crono.final;
  if (ms != null) { reloxo.textContent = formato(ms); reloxo.hidden = false; }
  else if (ler(K_HISTORIAL, []).length) { reloxo.textContent = '📊'; reloxo.hidden = false; }
  else reloxo.hidden = true;
  botonCaca.classList.toggle('correndo', correndo);
  const min = correndo ? ms / 60000 : 0;
  botonCaca.dataset.cara = min >= CARAS[2] ? 2 : min >= CARAS[1] ? 1 : 0;
}
function arrancarTic(){ clearInterval(tic); tic = setInterval(amosar, 250); }

botonCaca.addEventListener('click', () => {
  if (crono.inicio){                                   // parar
    const ms = Date.now() - crono.inicio;
    crono = {final: ms};
    clearInterval(tic);
    if (ms >= MINIMO){
      const h = ler(K_HISTORIAL, []);
      h.push({fin: Date.now(), ms});
      gardar(K_HISTORIAL, h.slice(-300));
      if (ler(K_SON, true)) cisterna();
    }
  } else {                                             // comezar
    crono = {inicio: Date.now()};
    arrancarTic();
  }
  gardar(K_CRONO, crono); amosar();
});
if (crono.inicio) arrancarTic();
amosar();

/* ---------- Son de cisterna (feito co navegador, sen ficheiros) ---------- */
let audio = null;
function cisterna(){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, dur = 2.2;
    const buf = audio.createBuffer(1, audio.sampleRate * dur, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const ruido = audio.createBufferSource(); ruido.buffer = buf;
    const filtro = audio.createBiquadFilter(); filtro.type = 'bandpass'; filtro.Q.value = 0.8;
    filtro.frequency.setValueAtTime(1400, t);
    filtro.frequency.exponentialRampToValueAtTime(380, t + dur);
    const vol = audio.createGain();
    vol.gain.setValueAtTime(0.0001, t);
    vol.gain.exponentialRampToValueAtTime(0.45, t + 0.15);
    vol.gain.exponentialRampToValueAtTime(0.25, t + 1.2);
    vol.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    ruido.connect(filtro).connect(vol).connect(audio.destination);
    ruido.start(t); ruido.stop(t + dur);
    /* glu-glu final */
    [1.5, 1.75].forEach(dt => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(260, t + dt); o.frequency.exponentialRampToValueAtTime(140, t + dt + .12);
      g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.18, t + dt + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + .14);
      o.connect(g).connect(audio.destination); o.start(t + dt); o.stop(t + dt + .16);
    });
  } catch(e){}
}

/* ---------- Panel de estatísticas ---------- */
function abrirPanel(){
  const h = ler(K_HISTORIAL, []);
  const semana = Date.now() - 7 * 864e5;
  const daSemana = h.filter(x => x.fin >= semana);
  const tempos = h.map(x => x.ms);
  const media = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : 0;
  const data = ts => { const d = new Date(ts); return `${dd(d.getDate())}/${dd(d.getMonth()+1)} · ${dd(d.getHours())}:${dd(d.getMinutes())}`; };

  panel.innerHTML = `
    <h2 id="panel-titulo">Os teus tempos</h2>
    ${h.length ? `
      <div class="cifras">
        <div class="cifra"><b>${formato(Math.min(...tempos))}</b><span>Récord (máis rápida)</span></div>
        <div class="cifra"><b>${formato(Math.max(...tempos))}</b><span>A máis longa</span></div>
        <div class="cifra"><b>${formato(media)}</b><span>Media</span></div>
        <div class="cifra"><b>${daSemana.length}</b><span>Nos últimos 7 días</span></div>
      </div>
      <h3>Últimas</h3>
      <ul class="ultimas">${h.slice(-6).reverse().map(x => `<li><span>${data(x.fin)}</span><b>${formato(x.ms)}</b></li>`).join('')}</ul>
    ` : `<p class="baleiro">Aínda non hai tempos gardados. Toca a caquiña para comezar.</p>`}
    <label class="opcion"><input type="checkbox" id="opcion-son" ${ler(K_SON, true) ? 'checked' : ''}> Son de cisterna ao parar</label>
    <div class="botons">
      ${h.length ? `<button class="boton discreto" type="button" id="borrar-historial">Borrar historial</button>` : '<span></span>'}
      <button class="boton" type="button" id="pechar-panel">Pechar</button>
    </div>`;

  panel.querySelector('#opcion-son').addEventListener('change', e => gardar(K_SON, e.target.checked));
  panel.querySelector('#pechar-panel').addEventListener('click', () => panel.close());
  panel.querySelector('#borrar-historial')?.addEventListener('click', () => {
    if (confirm('Seguro que queres borrar todos os tempos?')) {
      borrar(K_HISTORIAL);
      if (!crono.inicio) { crono = {}; gardar(K_CRONO, crono); }
      amosar(); panel.close();
    }
  });
  panel.showModal();
}
reloxo.addEventListener('click', abrirPanel);
/* Pechar tocando fóra do panel */
panel.addEventListener('click', e => { if (e.target === panel) panel.close(); });
